<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 920">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#081018"/>
    <stop offset="100%" stop-color="#101d2a"/>
  </linearGradient>
  <style>
    .title { font: 700 34px Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .subtitle { font: 500 18px Helvetica, Arial, sans-serif; fill: #9fb3c8; }
    .cluster { font: 700 22px Helvetica, Arial, sans-serif; fill: #dce7f3; }
    .note { font: 600 16px Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .small { font: 500 13px Helvetica, Arial, sans-serif; fill: #9fb3c8; }
  </style>
</defs>
<rect width="1360" height="920" fill="url(#bg)"/>
<text x="60" y="60" class="title" text-anchor="start"><tspan x="60" dy="0">Jarbas knowledge map</tspan></text>
<text x="60" y="94" class="subtitle" text-anchor="start"><tspan x="60" dy="0">Six notes now, with the proof workflow cluster finally deep enough</tspan><tspan x="60" dy="22">to feel like a real kit.</tspan></text>
<rect x="70" y="156" width="500" height="500" rx="18" fill="#132231" stroke="#5e7fa3" stroke-width="2"/>
<rect x="610" y="156" width="320" height="250" rx="18" fill="#132231" stroke="#5e7fa3" stroke-width="2"/>
<rect x="970" y="156" width="320" height="250" rx="18" fill="#132231" stroke="#5e7fa3" stroke-width="2"/>
<rect x="400" y="706" width="560" height="138" rx="18" fill="#142536" stroke="#5e7fa3" stroke-width="2"/>
<text x="100" y="196" class="cluster" text-anchor="start"><tspan x="100" dy="0">Proof workflow</tspan></text>
<text x="640" y="196" class="cluster" text-anchor="start"><tspan x="640" dy="0">Radio and measurement</tspan></text>
<text x="1000" y="196" class="cluster" text-anchor="start"><tspan x="1000" dy="0">CAD and scientific tooling</tspan></text>
<text x="430" y="746" class="cluster" text-anchor="start"><tspan x="430" dy="0">Repo filter</tspan></text>
<rect x="95" y="230" width="450" height="78" rx="14" fill="#1d3043" stroke="#6f8db0" stroke-width="2"/>
<text x="119" y="260" class="note" text-anchor="start"><tspan x="119" dy="0">Proof-method cue card</tspan></text>
<text x="119" y="288" class="small" text-anchor="start"><tspan x="119" dy="0">Pick the first proof move without pretending it is automatic.</tspan></text>
<rect x="95" y="324" width="450" height="78" rx="14" fill="#1d3043" stroke="#6f8db0" stroke-width="2"/>
<text x="119" y="354" class="note" text-anchor="start"><tspan x="119" dy="0">Proof-study loop</tspan></text>
<text x="119" y="382" class="small" text-anchor="start"><tspan x="119" dy="0">Delayed retrieval, worked-example audit, interleaving.</tspan></text>
<rect x="95" y="418" width="450" height="78" rx="14" fill="#1d3043" stroke="#6f8db0" stroke-width="2"/>
<text x="119" y="448" class="note" text-anchor="start"><tspan x="119" dy="0">Weekly proof review card</tspan></text>
<text x="119" y="476" class="small" text-anchor="start"><tspan x="119" dy="0">A weekly reset that forces recall, audit, and honest load control.</tspan></text>
<rect x="95" y="512" width="450" height="96" rx="14" fill="#1d3043" stroke="#6f8db0" stroke-width="2"/>
<text x="119" y="542" class="note" text-anchor="start"><tspan x="119" dy="0">Proof-journal error taxonomy</tspan></text>
<text x="119" y="570" class="small" text-anchor="start"><tspan x="119" dy="0">Error tags plus gates for when the wider</tspan><tspan x="119" dy="18">math load may grow.</tspan></text>
<rect x="635" y="248" width="270" height="108" rx="14" fill="#1d3043" stroke="#6f8db0" stroke-width="2"/>
<text x="659" y="278" class="note" text-anchor="start"><tspan x="659" dy="0">Home radio telescope</tspan><tspan x="659" dy="19">target/log matrix</tspan></text>
<text x="659" y="324" class="small" text-anchor="start"><tspan x="659" dy="0">Learn radio astronomy through logging discipline</tspan><tspan x="659" dy="18">before hardware escalation.</tspan></text>
<rect x="995" y="248" width="270" height="108" rx="14" fill="#1d3043" stroke="#6f8db0" stroke-width="2"/>
<text x="1019" y="278" class="note" text-anchor="start"><tspan x="1019" dy="0">Shared starter part spec</tspan></text>
<text x="1019" y="306" class="small" text-anchor="start"><tspan x="1019" dy="0">A common benchmark object across three</tspan><tspan x="1019" dy="18">CAD stacks.</tspan></text>
<text x="430" y="784" class="note" text-anchor="start"><tspan x="430" dy="0">Keep only notes that still earn a reread after a month.</tspan></text>
<text x="430" y="812" class="small" text-anchor="start"><tspan x="430" dy="0">Reusable method, benchmark, or decision beats</tspan><tspan x="430" dy="18">decorative documentation.</tspan></text>
<text x="60" y="884" class="small" text-anchor="start"><tspan x="60" dy="0">This is a map, not a taxonomy. The point is fast orientation and real reuse.</tspan></text>
</svg>
