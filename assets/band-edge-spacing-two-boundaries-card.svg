<text x="625.2" y="418.0" class="small" text-anchor="middle"><tspan x="625.2" dy="0">1.24 R_s</tspan><tspan x="625.2" dy="18">first full settle</tspan></text>
<line x1="1025.1" y1="336.0" x2="1025.1" y2="1050.0" stroke="#f8fafc" stroke-width="2.2" opacity="0.9" stroke-linecap="round" stroke-dasharray="10 8"/>
