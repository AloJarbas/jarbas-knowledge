<text x="1025.1" y="658.0" class="small" text-anchor="middle"><tspan x="1025.1" dy="0">1.57 R_s</tspan><tspan x="1025.1" dy="18">residual crossover</tspan></text>
<text x="1188.0" y="228.0" class="label" text-anchor="start">Portable readout</text>
<text x="1188.0" y="258.0" class="body" text-anchor="start"><tspan x="1188.0" dy="0">This is not one spacing boundary. It</tspan><tspan x="1188.0" dy="22">is two different questions with two</tspan><tspan x="1188.0" dy="22">different answers.</tspan></text>
<rect x="1184.0" y="330.0" width="410.0" height="136.0" rx="18.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="1204.0" y="364.0" class="label" text-anchor="start">1.00 R_s</text>
<text x="1204.0" y="398.0" class="body" text-anchor="start">proxy 0.0387 / 100%</text>
<text x="1204.0" y="428.0" class="body" text-anchor="start">half-sine 0.0995 / 0%</text>
<rect x="1184.0" y="484.0" width="410.0" height="136.0" rx="18.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="1204.0" y="518.0" class="label" text-anchor="start">1.24 R_s</text>
<text x="1204.0" y="552.0" class="body" text-anchor="start">proxy 0.0028 / 100%</text>
<text x="1204.0" y="582.0" class="body" text-anchor="start">half-sine 0.0447 / 100%</text>
<rect x="1184.0" y="638.0" width="410.0" height="136.0" rx="18.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="1204.0" y="672.0" class="label" text-anchor="start">1.57 R_s</text>
<text x="1204.0" y="706.0" class="body" text-anchor="start">proxy 0.00020 / 100%</text>
<text x="1204.0" y="736.0" class="body" text-anchor="start">half-sine 0.00017 / 100%</text>
<text x="1188.0" y="816.0" class="label" text-anchor="start">Why keep this note</text>
<text x="1188.0" y="846.0" class="body" text-anchor="start"><tspan x="1188.0" dy="0">It protects against the sloppy sentence</tspan><tspan x="1188.0" dy="22">that spacing &quot;fixes&quot; the half-sine lane</tspan><tspan x="1188.0" dy="22">at one magic point. The settle band</tspan><tspan x="1188.0" dy="22">recovers around 1.24 R_s, but the</tspan><tspan x="1188.0" dy="22">stricter mean-residual ranking only flips</tspan><tspan x="1188.0" dy="22">much later.</tspan></text>
<text x="1188.0" y="980.0" class="label" text-anchor="start">Decision rule</text>
<text x="1188.0" y="1010.0" class="body" text-anchor="start"><tspan x="1188.0" dy="0">If you only need the half-sine lane to</tspan><tspan x="1188.0" dy="22">stop failing the settle band, 1.24 R_s is</tspan><tspan x="1188.0" dy="22">enough in this setup. If you care about</tspan><tspan x="1188.0" dy="22">which loop is actually cleaner, the</tspan><tspan x="1188.0" dy="22">honest boundary is closer to 1.57 R_s.</tspan></text>
<text x="92.0" y="1170.0" class="label" text-anchor="start">What this card protects against</text>
<text x="92.0" y="1200.0" class="body" text-anchor="start"><tspan x="92.0" dy="0">Do not collapse &quot;track-ready again&quot; and &quot;residual ranking flipped&quot; into one sentence. One nearby-channel loop can have</tspan><tspan x="92.0" dy="22">an early settle boundary and a later quality boundary.</tspan></text>
<text x="92.0" y="1300.0" class="label" text-anchor="start">Source basis</text>
<text x="92.0" y="1330.0" class="tiny" text-anchor="start"><tspan x="92.0" dy="0">External framing comes from Daniel Estévez plus the GNU Radio FLL Band-Edge wiki and source. The public values here</tspan><tspan x="92.0" dy="20">are a direct extraction from jarbas-sdr-visual-notes/notes/band-edge-spacing-boundary.md and its dated 2026-05-24</tspan><tspan x="92.0" dy="20">research memo.</tspan></text>
</svg>