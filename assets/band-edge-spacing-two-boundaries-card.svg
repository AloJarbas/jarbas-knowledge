<text x="64.0" y="68.0" class="title" text-anchor="start">Band-edge spacing has two boundaries:</text>
<text x="64.0" y="108.0" class="title" text-anchor="start">settle first, ranking later</text>
<text x="64.0" y="144.0" class="subtitle" text-anchor="start"><tspan x="64.0" dy="0">At 0 dB adjacent power, the GNU Radio / half-sine lane becomes track-ready again near 1.24 R_s,</tspan><tspan x="64.0" dy="24">but it does not beat the proxy on mean tail residual until about 1.57 R_s.</tspan></text>
<rect x="64.0" y="188.0" width="1086.0" height="920.0" rx="24.0" fill="#122030" opacity="1.0" stroke="#324861" stroke-width="2.0"/>
<rect x="1178.0" y="188.0" width="458.0" height="920.0" rx="24.0" fill="#122030" opacity="1.0" stroke="#324861" stroke-width="2.0"/>
<rect x="64.0" y="1134.0" width="1572.0" height="250.0" rx="22.0" fill="#122030" opacity="1.0" stroke="#324861" stroke-width="2.0"/>
<text x="92.0" y="228.0" class="label" text-anchor="start">Residual ranking versus spacing</text>
<text x="92.0" y="258.0" class="body" text-anchor="start"><tspan x="92.0" dy="0">Same bounded loop as the adjacent-loop card: one desired QPSK channel, one equal-power neighbor, 4</tspan><tspan x="92.0" dy="22">samples/symbol, 63 taps, alpha = 0.35, loop gain 0.02, and spacing swept from 0.80 R_s to 1.65 R_s.</tspan></text>
<rect x="92.0" y="318.0" width="1030.0" height="470.0" rx="24.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="92.0" y="826.0" class="label" text-anchor="start">Half-sine settle fraction</text>
<text x="92.0" y="856.0" class="body" text-anchor="start"><tspan x="92.0" dy="0">The first full-settle point lands earlier than the residual crossover. Proxy stays at 100%</tspan><tspan x="92.0" dy="22">across this sweep; the half-sine lane is the moving one.</tspan></text>
