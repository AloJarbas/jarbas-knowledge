<rect x="26.0" y="26.0" width="1648.0" height="1368.0" rx="28.0" fill="#0d1826" opacity="1.0" stroke="#223246" stroke-width="2.0"/>
<text x="64.0" y="68.0" class="title" text-anchor="start">Lower loop gain calms adjacent pull,</text>
<text x="64.0" y="108.0" class="title" text-anchor="start">but it does not erase detector geometry</text>
<text x="64.0" y="144.0" class="subtitle" text-anchor="start"><tspan x="64.0" dy="0">At the first settle-point spacing of 1.24 R_s, slower gains shrink both residuals,</tspan><tspan x="64.0" dy="24">yet the half-sine lane stays about 15x worse and loses settle margin first as gain rises.</tspan></text>
<rect x="64.0" y="188.0" width="1086.0" height="920.0" rx="24.0" fill="#122030" opacity="1.0" stroke="#324861" stroke-width="2.0"/>
<rect x="1178.0" y="188.0" width="458.0" height="920.0" rx="24.0" fill="#122030" opacity="1.0" stroke="#324861" stroke-width="2.0"/>
<rect x="64.0" y="1134.0" width="1572.0" height="250.0" rx="22.0" fill="#122030" opacity="1.0" stroke="#324861" stroke-width="2.0"/>
<text x="92.0" y="228.0" class="label" text-anchor="start">Residual pull versus loop gain</text>
<text x="92.0" y="258.0" class="body" text-anchor="start"><tspan x="92.0" dy="0">Same bounded loop as the spacing note, but spacing held at 1.24 R_s and gain swept from 0.0005 to 0.0240.</tspan><tspan x="92.0" dy="22">This asks whether the early settle boundary is mostly a tuning artifact or still a geometry problem.</tspan></text>
<rect x="92.0" y="318.0" width="1030.0" height="470.0" rx="24.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="92.0" y="826.0" class="label" text-anchor="start">Residual ratio stays flat</text>
<text x="92.0" y="856.0" class="body" text-anchor="start"><tspan x="92.0" dy="0">The ratio is the clean test. If retuning truly fixed the ranking, this line would collapse</tspan><tspan x="92.0" dy="22">toward 1. It does not.</tspan></text>
<rect x="92.0" y="854.0" width="1030.0" height="214.0" rx="24.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
