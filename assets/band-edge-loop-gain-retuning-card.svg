<text x="1204.0" y="586.0" class="body" text-anchor="start">half-sine 0.04475 / 100%</text>
<text x="1204.0" y="616.0" class="body" text-anchor="start">ratio 15.8x</text>
<rect x="1184.0" y="660.0" width="410.0" height="154.0" rx="18.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="1204.0" y="694.0" class="label" text-anchor="start">gain 0.022</text>
<text x="1204.0" y="728.0" class="body" text-anchor="start">proxy 0.00309 / 100%</text>
<text x="1204.0" y="758.0" class="body" text-anchor="start">half-sine 0.04907 / 62.5%</text>
<text x="1204.0" y="788.0" class="body" text-anchor="start">ratio 15.9x</text>
<text x="1188.0" y="860.0" class="label" text-anchor="start">Portable readout</text>
<text x="1188.0" y="890.0" class="body" text-anchor="start"><tspan x="1188.0" dy="0">Lower gain really does calm both loops.</tspan><tspan x="1188.0" dy="22">But the ratio barely moves, which means</tspan><tspan x="1188.0" dy="22">the retuning mostly rescales the same</tspan><tspan x="1188.0" dy="22">geometry penalty instead of fixing the</tspan><tspan x="1188.0" dy="22">ranking.</tspan></text>
<text x="1188.0" y="1018.0" class="label" text-anchor="start">Decision rule</text>
<text x="1188.0" y="1048.0" class="body" text-anchor="start"><tspan x="1188.0" dy="0">If the half-sine lane already lost badly</tspan><tspan x="1188.0" dy="22">at 1.24 R_s, turning the loop down is not</tspan><tspan x="1188.0" dy="22">the main cure. Change the spacing or the</tspan><tspan x="1188.0" dy="22">detector geometry before you expect gain</tspan><tspan x="1188.0" dy="22">alone to rescue the comparison.</tspan></text>
<text x="92.0" y="1170.0" class="label" text-anchor="start">What this card protects against</text>
<text x="92.0" y="1200.0" class="body" text-anchor="start"><tspan x="92.0" dy="0">Do not explain the 1.24 R_s result away as a simple loop-tuning artifact. A slower loop helps both designs, but the</tspan><tspan x="92.0" dy="22">half-sine lane stays roughly 15x worse and gives up full settle margin first as the gain comes back up.</tspan></text>
<text x="92.0" y="1300.0" class="label" text-anchor="start">Source basis</text>
<text x="92.0" y="1330.0" class="tiny" text-anchor="start"><tspan x="92.0" dy="0">External framing comes from Daniel Estévez plus the GNU Radio FLL Band-Edge wiki and source,</tspan><tspan x="92.0" dy="20">with Wireless Pi kept only for the acquisition-versus-tracking loop-bandwidth reminder. The</tspan><tspan x="92.0" dy="20">public values here are extracted from</tspan><tspan x="92.0" dy="20">jarbas-sdr-visual-notes/notes/band-edge-loop-gain-retuning.md and its dated 2026-05-24 research</tspan><tspan x="92.0" dy="20">memo.</tspan></text>
</svg>