<rect x="952.3" y="454.0" width="164.0" height="58.0" rx="14.0" fill="#17283b" opacity="1.0" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1034.3" y="482.0" class="small" text-anchor="middle"><tspan x="1034.3" dy="0">0.022</tspan><tspan x="1034.3" dy="18">first settle loss</tspan></text>
<rect x="1184.0" y="316.0" width="410.0" height="154.0" rx="18.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="1204.0" y="350.0" class="label" text-anchor="start">gain 0.002</text>
<text x="1204.0" y="384.0" class="body" text-anchor="start">proxy 0.00030 / 100%</text>
<text x="1204.0" y="414.0" class="body" text-anchor="start">half-sine 0.00461 / 100%</text>
<text x="1204.0" y="444.0" class="body" text-anchor="start">ratio 15.2x</text>
<rect x="1184.0" y="488.0" width="410.0" height="154.0" rx="18.0" fill="#0f1724" opacity="1.0" stroke="#334155" stroke-width="2.0"/>
<text x="1204.0" y="522.0" class="label" text-anchor="start">gain 0.020</text>
