<text x="76.0" y="1073.0" class="small" text-anchor="end">14x</text>
<line x1="110.0" y1="996.7" x2="1104.0" y2="996.7" stroke="#334155" stroke-width="1.4" opacity="0.8" stroke-linecap="round" stroke-dasharray="8 8"/>
<text x="76.0" y="1001.7" class="small" text-anchor="end">15x</text>
<line x1="110.0" y1="925.3" x2="1104.0" y2="925.3" stroke="#334155" stroke-width="1.4" opacity="0.8" stroke-linecap="round" stroke-dasharray="8 8"/>
<text x="76.0" y="930.3" class="small" text-anchor="end">16x</text>
<line x1="110.0" y1="854.0" x2="1104.0" y2="854.0" stroke="#334155" stroke-width="1.4" opacity="0.8" stroke-linecap="round" stroke-dasharray="8 8"/>
